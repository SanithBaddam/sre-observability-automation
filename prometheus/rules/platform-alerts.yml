groups:
  - name: platform-reliability
    rules:
      - alert: KubernetesHighPodRestartRate
        expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[15m])) > 5
        for: 10m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "High pod restart rate"
          runbook: "runbooks/pod-restarts.md"

      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 10m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Kubernetes node is not ready"
